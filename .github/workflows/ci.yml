name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: Exact mlx-swift commit used by the library manifest
        type: string
        required: true
        default: 786724757aa480f049d3a913c59da7e0e61ad5dc
      library_ref:
        description: Exact library commit; an empty value selects the triggering commit
        type: string
      swiftlm_ref:
        description: Exact SwiftLM commit to validate
        type: string
        required: true
        default: d2f09fb66097739de05c63397e18bd259edeadd0
      run_speculative_eval:
        description: Download both models for speculative decoding evaluation (15-minute limit)
        type: boolean
        default: false
      main_model:
        description: Main model downloaded only for the optional speculative evaluation
        type: string
        default: mlx-community/Qwen3.5-9B-4bit
      draft_model:
        description: Draft model downloaded only for the optional speculative evaluation
        type: string
        default: mlx-community/Qwen3.5-0.8B-MLX-4bit

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  CORE_REF: ${{ inputs.core_ref || '786724757aa480f049d3a913c59da7e0e61ad5dc' }}
  LIBRARY_REF: ${{ inputs.library_ref || github.sha }}
  SWIFTLM_REF: ${{ inputs.swiftlm_ref || 'd2f09fb66097739de05c63397e18bd259edeadd0' }}

jobs:
  build-and-test:
    name: Build and Test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      LIBRARY_TEST_SUITES: |-
        MLXLMTests/MLXTestingSuite/ForkGenerationTests
        MLXLMTests/MLXTestingSuite/ForkSpeculativeGenerationTests
        MLXLMTests/MLXTestingSuite/ForkCacheCompatibilityTests
        MLXLMTests/MLXTestingSuite/Gemma4VideoTests
        MLXLMTests/MLXTestingSuite/Gemma4VideoGeometryTests
        MLXLMTests/Gemma4VideoInputTests
        MLXLMTests/MLXTestingSuite/Qwen35FramingTests
        MLXLMTests/GatedDeltaTests
        MLXLMTests/GatedDeltaQKNormTests
        MLXLMTests/Qwen35MTPMetalTests
        MLXLMTests/RotatingKVCacheRewindTests
        MLXLMTests/SpeculativeRoundRewindTests
    steps:
      - name: Validate exact source inputs
        run: |
          validate_ref() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Set $name to a full 40-character commit SHA."
              exit 1
            fi
          }
          validate_ref core_ref "$CORE_REF"
          validate_ref library_ref "$LIBRARY_REF"

      - name: Checkout CI result validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-controls
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Set up Node for result validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout selected library source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIBRARY_REF }}
          path: mlx-swift-lm
          submodules: recursive
          persist-credentials: false

      - name: Checkout selected core source
        uses: actions/checkout@v4
        with:
          repository: agoodkind/mlx-swift
          ref: ${{ env.CORE_REF }}
          path: mlx-swift
          submodules: recursive
          persist-credentials: false

      - name: Verify selected library and core commits
        run: |
          test "$(git -C mlx-swift-lm rev-parse HEAD)" = "$LIBRARY_REF"
          test "$(git -C mlx-swift rev-parse HEAD)" = "$CORE_REF"
          printf 'library=%s\ncore=%s\n' "$LIBRARY_REF" "$CORE_REF" > "$RUNNER_TEMP/cohort-sources.txt"
          cat "$RUNNER_TEMP/cohort-sources.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the library dependency graph
        working-directory: mlx-swift-lm
        run: |
          xcodebuild -resolvePackageDependencies -scheme mlx-swift-lm-Package \
            -derivedDataPath "$RUNNER_TEMP/library-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/library-packages"
          RESOLVED_CORE=$(git -C "$RUNNER_TEMP/library-packages/checkouts/mlx-swift" rev-parse HEAD)
          if [[ "$RESOLVED_CORE" != "$CORE_REF" ]]; then
            echo "::error::The library resolved core $RESOLVED_CORE instead of $CORE_REF."
            exit 1
          fi

      - name: Build bounded library tests
        working-directory: mlx-swift-lm
        run: |
          xcodebuild build-for-testing -scheme mlx-swift-lm-Package -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/library-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/library-packages" \
            -skipPackagePluginValidation -parallel-testing-enabled NO -jobs 4 \
            -only-testing:MLXLMTests

      - name: Build Metal kernels from the selected core
        run: |
          xcodebuild -downloadComponent MetalToolchain
          mkdir -p "$RUNNER_TEMP/mlx-metallib/lib"
          cmake -S mlx-swift/Source/Cmlx/mlx -B "$RUNNER_TEMP/mlx-metallib" \
            -DCMAKE_BUILD_TYPE=Release -DMLX_METAL_JIT=OFF \
            -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF \
            -DMLX_BUILD_BENCHMARKS=OFF -DMLX_BUILD_PYTHON_BINDINGS=OFF \
            -DMLX_METAL_PATH="$RUNNER_TEMP/mlx-metallib/lib"
          cmake --build "$RUNNER_TEMP/mlx-metallib" --target mlx-metallib --parallel 4
          KERNEL_BUILD="$RUNNER_TEMP/mlx-metallib/mlx/backend/metal/kernels"
          if [[ -f "$KERNEL_BUILD/steel_gemm_fused_nax.air" ]]; then
            mkdir -p "$RUNNER_TEMP/mlx-metallib/nax"
            for kernel in steel_gemm_fused_nax steel_gemm_splitk_nax steel_gemm_gather_nax steel_gemm_segmented_nax steel_attention_nax quantized_nax fp_quantized_nax; do
              xcrun -sdk macosx metal -mmacosx-version-min="$(sw_vers -productVersion)" \
                "$KERNEL_BUILD/$kernel.air" -o "$RUNNER_TEMP/mlx-metallib/nax/$kernel.metallib"
            done
          else
            echo "CMake did not enable NAX kernels for this SDK and deployment target."
          fi

      - name: Colocate source-built Metal libraries
        env:
          BINARY_DIRECTORY: ${{ runner.temp }}/library-derived/Build/Products/Debug
        run: |
          cp "$RUNNER_TEMP/mlx-metallib/lib/mlx.metallib" "$BINARY_DIRECTORY/mlx.metallib"
          for test_bundle in "$BINARY_DIRECTORY"/*.xctest; do
            cp "$RUNNER_TEMP/mlx-metallib/lib/mlx.metallib" "$test_bundle/Contents/MacOS/mlx.metallib"
            if [[ -d "$RUNNER_TEMP/mlx-metallib/nax" ]]; then
              cp -R "$RUNNER_TEMP/mlx-metallib/nax" "$test_bundle/Contents/MacOS/nax"
            fi
          done
          if [[ -d "$RUNNER_TEMP/mlx-metallib/nax" ]]; then
            cp -R "$RUNNER_TEMP/mlx-metallib/nax" "$BINARY_DIRECTORY/nax"
          fi

      - name: Run bounded library regressions without pretrained models
        working-directory: mlx-swift-lm
        run: |
          selectors=()
          while IFS= read -r suite; do
            selectors+=("-only-testing:$suite")
          done <<< "$LIBRARY_TEST_SUITES"
          xcodebuild test-without-building -scheme mlx-swift-lm-Package -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/library-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/library-packages" \
            -resultBundlePath "$RUNNER_TEMP/library-tests.xcresult" \
            -skipPackagePluginValidation -parallel-testing-enabled NO -jobs 4 \
            "${selectors[@]}"

      - name: Verify selected library suites completed
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/library-tests.xcresult" \
            --compact > "$RUNNER_TEMP/library-tests.json"
          suites=()
          while IFS= read -r suite; do
            suites+=("$suite")
          done <<< "$LIBRARY_TEST_SUITES"
          node "$GITHUB_WORKSPACE/ci-controls/.github/scripts/verify-integration-results.mjs" xcode \
            "$RUNNER_TEMP/library-tests.json" "${suites[@]}"

      - name: Upload library source proof and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-test-results
          path: |
            ${{ runner.temp }}/cohort-sources.txt
            ${{ runner.temp }}/library-tests.xcresult
            ${{ runner.temp }}/library-tests.json
          if-no-files-found: error

  integration-test:
    name: Build & Test SwiftLM Integration
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SWIFTLM_TEST_FILTER: 'SwiftLMTests\.(PromptCacheTests|MultimodalTokenExtractionTests|ChatRequestParsingTests|ThinkingTagStripTests|OwnFeatureHTTPTests)'
    steps:
      - name: Validate exact source inputs
        run: |
          validate_ref() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Set $name to a full 40-character commit SHA."
              exit 1
            fi
          }
          validate_ref core_ref "$CORE_REF"
          validate_ref library_ref "$LIBRARY_REF"
          validate_ref swiftlm_ref "$SWIFTLM_REF"

      - name: Checkout CI result validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-controls
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Set up Node for result validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout selected library source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIBRARY_REF }}
          path: mlx-swift-lm
          submodules: recursive
          persist-credentials: false

      - name: Checkout selected core source
        uses: actions/checkout@v4
        with:
          repository: agoodkind/mlx-swift
          ref: ${{ env.CORE_REF }}
          path: mlx-swift
          submodules: recursive
          persist-credentials: false

      - name: Checkout selected SwiftLM source
        uses: actions/checkout@v4
        with:
          repository: agoodkind/SwiftLM
          ref: ${{ env.SWIFTLM_REF }}
          path: SwiftLM
          submodules: recursive
          persist-credentials: false

      - name: Bind SwiftLM to the selected core and library
        run: |
          test "$(git -C mlx-swift-lm rev-parse HEAD)" = "$LIBRARY_REF"
          test "$(git -C mlx-swift rev-parse HEAD)" = "$CORE_REF"
          test "$(git -C SwiftLM rev-parse HEAD)" = "$SWIFTLM_REF"
          git -C SwiftLM/mlx-swift fetch --quiet --no-tags --depth=1 "$GITHUB_WORKSPACE/mlx-swift" HEAD
          git -C SwiftLM/mlx-swift checkout --quiet --detach FETCH_HEAD
          git -C SwiftLM/mlx-swift-lm fetch --quiet --no-tags --depth=1 "$GITHUB_WORKSPACE/mlx-swift-lm" HEAD
          git -C SwiftLM/mlx-swift-lm checkout --quiet --detach FETCH_HEAD
          test "$(git -C SwiftLM/mlx-swift rev-parse HEAD)" = "$CORE_REF"
          test "$(git -C SwiftLM/mlx-swift-lm rev-parse HEAD)" = "$LIBRARY_REF"
          printf 'library=%s\ncore=%s\nswiftlm=%s\n' "$LIBRARY_REF" "$CORE_REF" "$SWIFTLM_REF" > "$RUNNER_TEMP/cohort-sources.txt"
          cat "$RUNNER_TEMP/cohort-sources.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify SwiftLM uses the selected local dependencies
        working-directory: SwiftLM
        run: |
          swift package dump-package > "$RUNNER_TEMP/swiftlm-manifest.json"
          for identity in mlx-swift mlx-swift-lm; do
            expected_path="$GITHUB_WORKSPACE/SwiftLM/$identity"
            if ! jq -e --arg identity "$identity" --arg path "$expected_path" \
              '.dependencies | any(.[] | .fileSystem[]?; .identity == $identity and .path == $path)' \
              "$RUNNER_TEMP/swiftlm-manifest.json"; then
              echo "::error::SwiftLM must use the selected local $identity package."
              exit 1
            fi
          done

      - name: Build SwiftLM and tests in Release
        working-directory: SwiftLM
        run: |
          swift build --build-system native --jobs 4 -c release -Xswiftc -enable-testing --build-tests
          BIN_DIR=$(swift build --build-system native -c release --show-bin-path)
          echo "SWIFTLM_BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"

      - name: Build Metal kernels from the selected core
        run: |
          xcodebuild -downloadComponent MetalToolchain
          mkdir -p "$RUNNER_TEMP/mlx-metallib/lib"
          cmake -S mlx-swift/Source/Cmlx/mlx -B "$RUNNER_TEMP/mlx-metallib" \
            -DCMAKE_BUILD_TYPE=Release -DMLX_METAL_JIT=OFF \
            -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF \
            -DMLX_BUILD_BENCHMARKS=OFF -DMLX_BUILD_PYTHON_BINDINGS=OFF \
            -DMLX_METAL_PATH="$RUNNER_TEMP/mlx-metallib/lib"
          cmake --build "$RUNNER_TEMP/mlx-metallib" --target mlx-metallib --parallel 4
          KERNEL_BUILD="$RUNNER_TEMP/mlx-metallib/mlx/backend/metal/kernels"
          if [[ -f "$KERNEL_BUILD/steel_gemm_fused_nax.air" ]]; then
            mkdir -p "$RUNNER_TEMP/mlx-metallib/nax"
            for kernel in steel_gemm_fused_nax steel_gemm_splitk_nax steel_gemm_gather_nax steel_gemm_segmented_nax steel_attention_nax quantized_nax fp_quantized_nax; do
              xcrun -sdk macosx metal -mmacosx-version-min="$(sw_vers -productVersion)" \
                "$KERNEL_BUILD/$kernel.air" -o "$RUNNER_TEMP/mlx-metallib/nax/$kernel.metallib"
            done
          else
            echo "CMake did not enable NAX kernels for this SDK and deployment target."
          fi

      - name: Colocate source-built Metal libraries
        env:
          BINARY_DIRECTORY: ${{ env.SWIFTLM_BIN_DIR }}
        run: |
          cp "$RUNNER_TEMP/mlx-metallib/lib/mlx.metallib" "$BINARY_DIRECTORY/mlx.metallib"
          for test_bundle in "$BINARY_DIRECTORY"/*.xctest; do
            cp "$RUNNER_TEMP/mlx-metallib/lib/mlx.metallib" "$test_bundle/Contents/MacOS/mlx.metallib"
            if [[ -d "$RUNNER_TEMP/mlx-metallib/nax" ]]; then
              cp -R "$RUNNER_TEMP/mlx-metallib/nax" "$test_bundle/Contents/MacOS/nax"
            fi
          done
          if [[ -d "$RUNNER_TEMP/mlx-metallib/nax" ]]; then
            cp -R "$RUNNER_TEMP/mlx-metallib/nax" "$BINARY_DIRECTORY/nax"
          fi

      - name: Run tests without pretrained models
        working-directory: SwiftLM
        run: |
          set -o pipefail
          status=0
          swift test --build-system native --jobs 4 -c release -Xswiftc -enable-testing --disable-swift-testing list --skip-build \
            > "$RUNNER_TEMP/swiftlm-tests.txt" 2> "$RUNNER_TEMP/swiftlm-discovery-errors.txt" || status=$?
          cat "$RUNNER_TEMP/swiftlm-discovery-errors.txt"
          cat "$RUNNER_TEMP/swiftlm-tests.txt"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::SwiftLM test discovery failed with exit status $status."
            exit "$status"
          fi
          for test_class in PromptCacheTests MultimodalTokenExtractionTests ChatRequestParsingTests ThinkingTagStripTests OwnFeatureHTTPTests; do
            if ! grep -F "SwiftLMTests.$test_class/" "$RUNNER_TEMP/swiftlm-tests.txt"; then
              echo "::error::The selected SwiftLM commit does not provide $test_class."
              exit 1
            fi
          done
          status=0
          swift test --build-system native --jobs 4 -c release -Xswiftc -enable-testing --disable-swift-testing --skip-build \
            --filter "$SWIFTLM_TEST_FILTER" 2>&1 | tee "$RUNNER_TEMP/swiftlm-runtime.log" || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::error::SwiftLM tests failed with exit status $status."
            exit "$status"
          fi
          node "$GITHUB_WORKSPACE/ci-controls/.github/scripts/verify-integration-results.mjs" swiftpm \
            "$RUNNER_TEMP/swiftlm-runtime.log" "$RUNNER_TEMP/swiftlm-tests.txt" \
            PromptCacheTests MultimodalTokenExtractionTests ChatRequestParsingTests ThinkingTagStripTests OwnFeatureHTTPTests

      - name: Run optional pretrained speculative decoding evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.run_speculative_eval
        timeout-minutes: 15
        working-directory: SwiftLM
        env:
          MAIN_MODEL: ${{ inputs.main_model }}
          DRAFT_MODEL: ${{ inputs.draft_model }}
        run: bash tests/test-speculative-eval.sh "$SWIFTLM_BIN_DIR/SwiftLM"

      - name: Upload selected SwiftLM dependency proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlm-release-sources
          path: |
            ${{ runner.temp }}/cohort-sources.txt
            ${{ runner.temp }}/swiftlm-manifest.json
            ${{ runner.temp }}/swiftlm-tests.txt
            ${{ runner.temp }}/swiftlm-discovery-errors.txt
            ${{ runner.temp }}/swiftlm-runtime.log
          if-no-files-found: error
