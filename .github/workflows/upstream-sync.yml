name: 🔄 Auto-Sync Upstream

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test upstream synchronization
        run: node --test .github/scripts/upstream-sync.test.mjs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure Git credentials
        env:
          GH_TOKEN: ${{ secrets.SWIFTLM_PR_TOKEN }}
        run: gh auth setup-git --hostname github.com

      - name: Update upstream candidate
        id: sync_branch
        env:
          GH_TOKEN: ${{ secrets.SWIFTLM_PR_TOKEN }}
          SYNC_UPSTREAM_URL: https://github.com/ml-explore/mlx-swift-lm.git
        run: node .github/scripts/upstream-sync.mjs sync

      - name: Create or update pull request
        if: steps.sync_branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWIFTLM_PR_TOKEN }}
        run: node .github/scripts/upstream-sync.mjs pr
